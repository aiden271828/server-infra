services:
  new-api:
    environment:
      SQL_DSN: postgresql://root:${POSTGRES_PASSWORD}@postgres:5432/new-api
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_TRUSTED_URL: https://ai.shenyuhan.online
      TRUSTED_PROXIES: ${EDGE_SUBNET}
      # 后台页面常会并发加载较多静态资源；关闭网页全局限流，保留 API 与关键操作限流。
      GLOBAL_WEB_RATE_LIMIT_ENABLE: "false"
    networks:
      - new-api-network
      - edge

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

networks:
  edge:
    name: edge
    external: true
