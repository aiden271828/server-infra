server {
  listen 80;
  server_name shenyuhan.online www.shenyuhan.online ai.shenyuhan.online;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name shenyuhan.online;

  ssl_certificate /etc/letsencrypt/live/shenyuhan.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shenyuhan.online/privkey.pem;

  root /var/www/root;

  location = / {
    try_files /index.html =404;
  }

  location / {
    return 404;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.shenyuhan.online;

  ssl_certificate /etc/letsencrypt/live/shenyuhan.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shenyuhan.online/privkey.pem;

  return 301 https://shenyuhan.online$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ai.shenyuhan.online;

  ssl_certificate /etc/letsencrypt/live/shenyuhan.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shenyuhan.online/privkey.pem;

  location / {
    proxy_pass http://new-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
