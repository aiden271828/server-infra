name: 部署网关

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy.yml"
      - "gateway/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gateway
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 配置 SSH
        env:
          DEPLOY_KEY: ${{ secrets.SERVER_DEPLOY_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$DEPLOY_KEY"
          ssh -o BatchMode=yes "${{ vars.SERVER_DEPLOY_USER }}@${{ vars.SERVER_HOST }}" \
            "/opt/server-infra/scripts/deploy.sh '${{ github.sha }}'"
